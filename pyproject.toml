[project]
name = "flysentinel"
version = "0.1.0"
description = "Streaming anomaly detection modeled on the fruit fly mushroom body"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ismail" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]

[project.scripts]
flysentinel = "flysentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flysentinel"]
